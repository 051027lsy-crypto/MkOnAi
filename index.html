<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이너프</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: 좌측 내비 + 본문. 흰 바탕, 먹색 버튼, 청록 포인트 하나. 영수증 점선·모노 글씨는 '예상 영수증'에만 쓴다. */
:root {
  --bg: #F5F6F8; --surface: #FFFFFF; --surface-2: #EEF0F3;
  --ink: #111318; --ink-2: #5F6775; --line: #E4E7EC;
  --btn: #111318; --btn-ink: #FFFFFF;
  --accent: #0B9A73; --accent-ink: #FFFFFF; --accent-soft: #DDF5EC;
  --good: #07785A; --good-soft: #DDF5EC;
  --warn: #8F5200; --warn-soft: #FDF0D9;
  --crit: #C62828; --crit-soft: #FDE3E1;
  --sans: 'Inter', 'Noto Sans KR', system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --num: 'Inter', 'Noto Sans KR', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', 'Noto Sans KR', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0D10; --surface: #14171C; --surface-2: #1C2027;
    --ink: #F2F4F7; --ink-2: #9AA3B2; --line: #262B33;
    --btn: #F2F4F7; --btn-ink: #0B0D10;
    --accent: #34D3A4; --accent-ink: #05241B; --accent-soft: #11322A;
    --good: #5FE0B8; --good-soft: #11322A;
    --warn: #F2B866; --warn-soft: #3A2A10;
    --crit: #FF8F86; --crit-soft: #40191A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0D10; --surface: #14171C; --surface-2: #1C2027;
  --ink: #F2F4F7; --ink-2: #9AA3B2; --line: #262B33;
  --btn: #F2F4F7; --btn-ink: #0B0D10;
  --accent: #34D3A4; --accent-ink: #05241B; --accent-soft: #11322A;
  --good: #5FE0B8; --good-soft: #11322A;
  --warn: #F2B866; --warn-soft: #3A2A10;
  --crit: #FF8F86; --crit-soft: #40191A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink);
  font: 14px/1.6 var(--sans);
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p { margin: 0; }
h1, h2 { text-wrap: balance; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.mono { font-family: var(--num); font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* shell */
.app { display: grid; grid-template-columns: 208px minmax(0, 1fr); column-gap: 36px; max-width: 1240px; margin: 0 auto; }
.side { position: sticky; top: 0; align-self: start; height: 100vh; padding-block: 28px; display: flex; flex-direction: column; gap: 28px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: -0.02em; }
.mark { width: 30px; height: 30px; border-radius: 9px; background: var(--btn); color: var(--btn-ink); display: grid; place-items: center; flex: none; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--surface-2); }
.nav a[aria-current="page"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--line); }
.side-foot { margin-top: auto; font-size: 12px; color: var(--ink-2); border-top: 1px solid var(--line); padding-top: 14px; }
.main { padding-block: 28px 56px; min-width: 0; }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px 16px; flex-wrap: wrap; margin-bottom: 20px; }
.head h1 { font-size: 28px; letter-spacing: -0.03em; font-weight: 700; line-height: 1.25; }
.sub { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.mbrand { display: none; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 14px; }

/* pills & buttons */
.pill { display: inline-flex; align-items: center; padding: 1px 9px; border-radius: 99px; font-size: 12px; font-weight: 500; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.info { background: var(--surface-2); color: var(--ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; text-decoration: none; color: var(--ink); }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--btn); border-color: var(--btn); color: var(--btn-ink); }
.btn.primary:hover { opacity: .88; background: var(--btn); }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { padding: 8px 16px; border: 0; background: transparent; cursor: pointer; font-weight: 500; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); }
.in { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
label.fl { display: grid; gap: 6px; font-size: 12px; color: var(--ink-2); font-weight: 500; }

/* summary strip */
.strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
.strip > div { padding: 16px 18px; min-width: 0; }
.strip > div + div { border-left: 1px solid var(--line); }
.k-label { font-size: 12px; color: var(--ink-2); letter-spacing: 0.02em; }
.k-val { font: 600 26px/1.25 var(--num); margin-top: 4px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.k-val small { font: 500 13px var(--sans); color: var(--ink-2); margin-left: 2px; letter-spacing: 0; }
.k-note { font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 10px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.bar.over > i { background: var(--crit); }
.bar.good > i { background: var(--good); }

/* panels & lists */
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; margin-top: 24px; align-items: start; }
.stack { display: grid; gap: 16px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; min-width: 0; }
.panel-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 16px 18px 12px; flex-wrap: wrap; }
.panel-h h2 { font-size: 15px; font-weight: 700; }
.panel-h .sub { margin: 0; }
.panel-b { padding: 4px 18px 18px; }
.rows { list-style: none; margin: 0; padding: 0; }
.grp { padding: 8px 18px; font-size: 12px; font-weight: 700; color: var(--ink-2); background: var(--surface-2); letter-spacing: 0.02em; }
.row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px 18px; border-top: 1px solid var(--line); }
.row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.nm { cursor: pointer; display: grid; gap: 3px; min-width: 0; }
.nm b { font-weight: 500; }
.unit { color: var(--ink-2); font-weight: 400; font-size: 13px; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12px; color: var(--ink-2); }
.price { font-size: 14px; text-align: right; }

/* receipt */
.rcol { position: sticky; top: 20px; display: grid; gap: 14px; }
.receipt { position: relative; background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: 10px 10px 0 0; padding: 18px 18px 14px; font-family: var(--mono); font-size: 13px; margin-bottom: 10px; }
.receipt::after {
  content: ""; position: absolute; left: -1px; right: -1px; top: 100%; height: 10px;
  background:
    linear-gradient(135deg, var(--surface) 5px, transparent 0) 0 0 / 10px 10px,
    linear-gradient(225deg, var(--surface) 5px, transparent 0) 0 0 / 10px 10px;
}
.r-top { display: flex; justify-content: space-between; gap: 8px; padding-bottom: 10px; border-bottom: 1.5px dashed var(--line); margin-bottom: 10px; }
.r-top b { font-family: var(--sans); font-size: 15px; }
.ln { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; }
.ln span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-sum { display: flex; justify-content: space-between; font-weight: 600; font-size: 15px; border-top: 1.5px dashed var(--line); margin-top: 10px; padding-top: 10px; }
.r-cap { margin-top: 8px; font-size: 12px; color: var(--ink-2); font-family: var(--sans); }
.rnote { font-size: 12px; color: var(--ink-2); }

/* forms */
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; padding: 4px 18px 18px; }
.form .wide { grid-column: 1 / -1; }
.drop { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; border: 1.5px dashed var(--line); border-radius: 10px; padding: 14px; }
.drop img { max-height: 84px; border-radius: 6px; border: 1px solid var(--line); }
.file:focus-within label { outline: 2px solid var(--accent); outline-offset: 2px; }
.draft li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 10px 18px; border-top: 1px solid var(--line); }
.empty { padding: 20px 18px 24px; color: var(--ink-2); font-size: 13px; }
.trip { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 4px 14px; padding: 12px 18px; border-top: 1px solid var(--line); align-items: baseline; }
.trip .items { color: var(--ink-2); font-size: 12px; grid-column: 2 / 4; }

/* report */
.g2 { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 16px; }
.g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g3 > div { padding: 4px 18px 18px; min-width: 0; }
.g3 > div + div { border-left: 1px solid var(--line); }
.chartwrap { overflow-x: auto; padding: 0 12px 12px; }
.chartwrap svg { display: block; min-width: 540px; width: 100%; height: auto; }
.gl { stroke: var(--line); stroke-width: 1; }
.ax { fill: var(--ink-2); font: 11px var(--num); }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--ink-2); padding: 0 18px 8px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2.5px solid var(--ink); vertical-align: middle; margin-right: 6px; }
.legend i.d { border-top: 2px dashed var(--ink-2); }
.cat { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 0; font-size: 13px; }
.cat .bar { margin: 0; }
.big { font: 600 30px/1.2 var(--num); letter-spacing: -0.02em; }
.big small { font: 500 13px var(--sans); color: var(--ink-2); margin-left: 2px; }
.weeks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
.weeks div { text-align: center; padding: 6px 2px; border-radius: 6px; background: var(--surface-2); font-size: 11px; color: var(--ink-2); }
.weeks div.on { background: var(--good-soft); color: var(--good); font-weight: 600; }
.opts { display: grid; gap: 8px; margin-top: 12px; }
.opt { text-align: left; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; font-weight: 500; }
.opt:hover { background: var(--surface-2); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.dup { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; }
.dup small { color: var(--ink-2); font-size: 12px; }
.note { font-size: 12px; color: var(--ink-2); }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 30; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 1060px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
  .rcol { position: static; }
  .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .strip > div:nth-child(3) { border-left: 0; }
  .strip > div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .g2 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side {
    position: fixed; left: 0; right: 0; bottom: 0; top: auto; height: auto; z-index: 20;
    flex-direction: row; gap: 0; background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  .side .brand, .side-foot { display: none; }
  .nav { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; gap: 2px; }
  .nav a { flex-direction: column; gap: 2px; font-size: 11px; padding: 6px 2px; text-align: center; }
  .main { padding-block: 20px 100px; }
  .mbrand { display: flex; }
  .g3 { grid-template-columns: minmax(0, 1fr); }
  .g3 > div + div { border-left: 0; border-top: 1px solid var(--line); padding-top: 16px; }
  .k-val { font-size: 21px; }
}
@media (max-width: 520px) {
  .form { grid-template-columns: minmax(0, 1fr); }
  .head h1 { font-size: 21px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 9h11M6.5 15h11"/></svg></span>이너프</div>
    <nav class="nav" aria-label="주요 화면">
      <a href="#recommend"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.2 10.2a1 1 0 0 0 1 .8h8.6a1 1 0 0 0 1-.8L19.5 8H6.2"/><circle cx="9" cy="19" r="1.3"/><circle cx="17" cy="19" r="1.3"/></svg>다음 장보기</a>
      <a href="#purchases"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>구매내역</a>
      <a href="#report"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V4M4 20h16"/><path d="M8 15l4-4 3 3 5-6"/></svg>리포트</a>
      <a href="#setup"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>설정</a>
    </nav>
    <div class="side-foot">예시 데이터로 보여주는 화면이에요. 입력하면 추천이 바로 바뀌어요.</div>
  </aside>
  <main class="main">
    <div class="mbrand"><span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 9h11M6.5 15h11"/></svg></span>이너프</div>
    <header class="head">
      <div><h1 id="ttl"></h1><p class="sub" id="sub"></p></div>
      <span class="pill info mono" id="today"></span>
    </header>
    <div id="view"></div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };

  /* ---------- 날짜 ---------- */
  var WD = '일월화수목금토';
  function dayNum(s) { var a = s.split('-').map(Number); return Math.round(Date.UTC(a[0], a[1] - 1, a[2]) / 864e5); }
  function dt(n) { return new Date(n * 864e5); }
  function md(n) { var d = dt(n); return (d.getUTCMonth() + 1) + '/' + d.getUTCDate(); }
  function mdw(n) { var d = dt(n); return (d.getUTCMonth() + 1) + '월 ' + d.getUTCDate() + '일(' + WD[d.getUTCDay()] + ')'; }
  function won(n) { return Math.round(n).toLocaleString('ko-KR'); }
  var TODAY = dayNum('2026-11-12');
  var MONTH0 = dayNum('2026-11-01');

  /* ---------- 품목 (소비 속도는 하루 2끼 기준 예시값) ---------- */
  var ITEMS = [
    ['egg', '계란', '10구', '유제품·달걀', 3900, 8],
    ['milk', '우유', '1L', '유제품·달걀', 2800, 5],
    ['yogurt', '요거트', '4입', '유제품·달걀', 3600, 4],
    ['tofu', '두부', '1모', '단백질', 2200, 4],
    ['chicken', '닭가슴살', '5팩', '단백질', 9900, 7],
    ['tuna', '참치캔', '4입', '단백질', 6900, 12],
    ['onion', '양파', '3입', '채소·과일', 3500, 14],
    ['scallion', '대파', '1단', '채소·과일', 2900, 7],
    ['salad', '샐러드 채소', '1봉', '채소·과일', 3200, 4],
    ['banana', '바나나', '1송이', '채소·과일', 3000, 4],
    ['rice', '즉석밥', '6개', '곡류·면', 7200, 6],
    ['bread', '식빵', '1봉', '곡류·면', 3500, 5],
    ['ramen', '라면', '5입', '곡류·면', 4500, 10],
    ['kimchi', '김치', '1kg', '가공·간편', 6900, 20],
    ['dumpling', '냉동만두', '1kg', '가공·간편', 6500, 10]
  ];
  var GROUPS = ['단백질', '채소·과일', '유제품·달걀', '곡류·면', '가공·간편'];
  var ORDER = [], ITEM = {};
  ITEMS.forEach(function (a) { ORDER.push(a[0]); ITEM[a[0]] = { id: a[0], name: a[1], unit: a[2], grp: a[3], price: a[4], base: a[5] }; });

  function trip(date, ids) {
    var d = dayNum(date);
    return ids.map(function (id) { return { id: id, day: d, qty: 1, price: ITEM[id].price }; });
  }
  var SEED = [].concat(
    trip('2026-10-27', ['egg', 'milk', 'tofu', 'onion', 'chicken', 'rice', 'ramen']),
    trip('2026-11-01', ['scallion', 'bread', 'kimchi', 'tuna', 'banana', 'tofu', 'milk', 'yogurt', 'dumpling', 'onion']),
    trip('2026-11-06', ['egg', 'chicken', 'salad', 'milk', 'bread', 'rice']),
    trip('2026-11-10', ['tofu', 'yogurt', 'banana', 'scallion', 'ramen', 'kimchi'])
  );

  var S = {
    settings: { budget: 350000, meals: 2, cycle: 5 },
    purchases: SEED,
    override: {},
    draft: [],
    form: { date: '2026-11-12', id: 'egg', qty: 1, price: ITEM.egg.price },
    photo: null,
    survey: { help: null, pay: null }
  };

  /* ---------- 추천 로직 ---------- */
  function stockMap(purchases, s, before) {
    var m = {};
    purchases.filter(function (p) { return p.day < before; })
      .sort(function (a, b) { return a.day - b.day; })
      .forEach(function (p) {
        var it = ITEM[p.id];
        var supply = Math.max(1, Math.round(it.base * p.qty * 2 / s.meals));
        var r = m[p.id] || (m[p.id] = { end: null, dups: [], price: 0 });
        var remaining = r.end == null ? 0 : Math.max(0, r.end - p.day);
        if (remaining > supply * 0.5) r.dups.push({ day: p.day, price: p.price, remaining: remaining });
        var start = r.end == null ? p.day : Math.max(p.day, r.end);
        r.end = start + supply;
        r.price = p.price / p.qty;
      });
    return m;
  }
  function recommend(tripDay, refDay, purchases, s, before) {
    var st = stockMap(purchases, s, before);
    var horizon = tripDay + s.cycle, buy = [], hold = [];
    ORDER.forEach(function (id) {
      var r = st[id]; if (!r) return;
      var o = { id: id, it: ITEM[id], end: r.end, price: Math.round(r.price), dups: r.dups, left: r.end - refDay };
      if (r.end < horizon) {
        o.tier = r.end <= refDay ? 'gone' : (r.end < tripDay ? 'soon' : 'next');
        buy.push(o);
      } else hold.push(o);
    });
    buy.sort(function (a, b) { return a.end - b.end; });
    hold.sort(function (a, b) { return a.end - b.end; });
    return { buy: buy, hold: hold, tripDay: tripDay, horizon: horizon };
  }
  function lastTrip() { return S.purchases.reduce(function (m, p) { return Math.max(m, p.day); }, 0); }
  function nextTripDay() { var l = lastTrip(); return l ? Math.max(TODAY, l + S.settings.cycle) : TODAY; }
  function budgetCap() { return Math.round(S.settings.budget * S.settings.cycle / 30 / 100) * 100; }
  function sum(arr, f) { return arr.reduce(function (a, x) { return a + f(x); }, 0); }
  function monthStats() {
    var ps = S.purchases.filter(function (p) { return p.day >= MONTH0 && p.day <= TODAY; });
    var spent = sum(ps, function (p) { return p.price; });
    var dom = TODAY - MONTH0 + 1;
    return { ps: ps, spent: spent, dom: dom, pace: S.settings.budget * dom / 30 };
  }

  /* ---------- 화면: 다음 장보기 ---------- */
  function viewRecommend() {
    var s = S.settings, ms = monthStats();
    var R = recommend(nextTripDay(), TODAY, S.purchases, s, Infinity);
    function on(o, isBuy) { return S.override[o.id] != null ? S.override[o.id] : isBuy; }
    var all = R.buy.map(function (o) { return { o: o, b: true }; }).concat(R.hold.map(function (o) { return { o: o, b: false }; }));
    var picked = all.filter(function (x) { return on(x.o, x.b); });
    var total = sum(picked, function (x) { return x.o.price; });
    var skippedHold = R.hold.filter(function (o) { return !on(o, false); });
    var saved = sum(skippedHold, function (o) { return o.price; });
    var cap = budgetCap(), diff = cap - total;
    var until = R.tripDay - TODAY;

    function pillFor(o) {
      if (o.tier === 'gone') return '<span class="pill crit">떨어졌어요</span><span class="mono">' + (o.end < TODAY ? (TODAY - o.end) + '일 전부터 없음' : '오늘부터 없음') + '</span>';
      if (o.tier === 'soon') return '<span class="pill warn">장보기 전에 떨어져요</span><span class="mono">' + (o.end - TODAY) + '일 뒤 소진</span>';
      return '<span class="pill info">다음 장보기 전에 떨어져요</span><span class="mono">' + (o.end - TODAY) + '일 뒤 소진</span>';
    }
    function row(o, isBuy) {
      var meta;
      if (isBuy) meta = pillFor(o);
      else {
        meta = '<span class="pill good">' + o.left + '일치 남음</span>';
        if (o.dups.length) meta += '<span class="pill warn">' + md(o.dups[o.dups.length - 1].day) + ' 중복 구매</span>';
      }
      return '<li class="row"><input type="checkbox" id="c-' + o.id + '" data-chk="' + o.id + '"' + (on(o, isBuy) ? ' checked' : '') + '>' +
        '<label class="nm" for="c-' + o.id + '"><b>' + o.it.name + ' <span class="unit">' + o.it.unit + '</span></b><span class="meta">' + meta + '</span></label>' +
        '<span class="price mono">' + won(o.price) + '</span></li>';
    }
    function grp(title, list) {
      if (!list.length) return '';
      return '<li class="grp">' + title + ' · ' + list.length + '개</li>' + list.map(function (o) { return row(o, true); }).join('');
    }
    var gone = R.buy.filter(function (o) { return o.tier === 'gone'; });
    var soon = R.buy.filter(function (o) { return o.tier === 'soon'; });
    var next = R.buy.filter(function (o) { return o.tier === 'next'; });

    var lines = picked.map(function (x) {
      return '<div class="ln"><span>' + x.o.it.name + ' ' + x.o.it.unit + '</span><span>' + won(x.o.price) + '</span></div>';
    }).join('') || '<div class="ln"><span>담은 품목이 없어요</span><span>0</span></div>';

    var html =
      '<section class="strip" aria-label="요약">' +
        '<div><div class="k-label">이번 달 식비</div><div class="k-val">' + won(ms.spent) + '<small>원</small></div>' +
          '<div class="bar"><i style="width:' + Math.min(100, ms.spent / s.budget * 100).toFixed(1) + '%"></i></div>' +
          '<div class="k-note">예산 ' + won(s.budget) + '원의 ' + Math.round(ms.spent / s.budget * 100) + '%</div></div>' +
        '<div><div class="k-label">다음 장보기</div><div class="k-val">' + md(R.tripDay) + '<small>(' + WD[dt(R.tripDay).getUTCDay()] + ')</small></div>' +
          '<div class="k-note">' + (until === 0 ? '오늘' : until + '일 뒤') + ' · 장보기 주기 ' + s.cycle + '일</div></div>' +
        '<div><div class="k-label">예상 지출</div><div class="k-val">' + won(total) + '<small>원</small></div>' +
          '<div class="bar ' + (diff < 0 ? 'over' : 'good') + '"><i style="width:' + Math.min(100, cap ? total / cap * 100 : 100).toFixed(1) + '%"></i></div>' +
          '<div class="k-note">1회 상한 ' + won(cap) + '원 ' + (diff >= 0 ? '안쪽' : '초과') + '</div></div>' +
        '<div><div class="k-label">이번엔 안 사도 되는 것</div><div class="k-val">' + won(saved) + '<small>원</small></div>' +
          '<div class="k-note">' + skippedHold.length + '개 품목 보류</div></div>' +
      '</section>' +
      '<div class="cols">' +
        '<div class="stack">' +
          '<section class="panel"><div class="panel-h"><h2>사야 할 것</h2><span class="sub">체크를 풀면 영수증에서 빠져요</span></div>' +
            '<ul class="rows">' + grp('이미 떨어짐', gone) + grp('장보기 전에 떨어짐', soon) + grp('다음 장보기 전까지', next) + (R.buy.length ? '' : '<li class="empty">지금 사야 할 품목이 없어요.</li>') + '</ul></section>' +
          '<section class="panel"><div class="panel-h"><h2>미뤄도 되는 것</h2><span class="sub">' + md(R.horizon) + ' 이후까지 남은 재고예요</span></div>' +
            '<ul class="rows">' + (R.hold.length ? R.hold.map(function (o) { return row(o, false); }).join('') : '<li class="empty">보류할 품목이 아직 없어요.</li>') + '</ul></section>' +
        '</div>' +
        '<aside class="rcol">' +
          '<div class="receipt"><div class="r-top"><b>예상 영수증</b><span>' + md(R.tripDay) + ' 예정</span></div>' + lines +
            '<div class="r-sum"><span>합계 ' + picked.length + '개</span><span>' + won(total) + '</span></div>' +
            '<div class="r-cap">1회 상한 ' + won(cap) + '원 · ' + (diff >= 0 ? won(diff) + '원 여유' : won(-diff) + '원 초과') + '</div></div>' +
          '<p class="rnote">장 본 뒤 실제 영수증을 입력하면 이 예상과 비교해서 리포트에 보여줘요.</p>' +
          '<a class="btn primary" href="#purchases">장 본 내역 입력하기</a>' +
        '</aside>' +
      '</div>';
    return { title: '다음 장보기', sub: mdw(R.tripDay) + '에 장 볼 때 이 목록만 보면 돼요', html: html };
  }

  /* ---------- 화면: 구매내역 ---------- */

    var dtotal = sum(S.draft, function (d) { return d.price; });

            '<div class="panel-b"><div class="drop file"><input class="sr" type="file" id="photo" accept="image/*">' +
              '<label class="btn" for="photo">영수증 사진 고르기</label>' +
              (S.photo ? '<img src="' + S.photo + '" alt="고른 영수증 사진">' : '') +
              '<span class="note" style="flex:1 1 200px">이 화면에서는 사진을 읽지 않고, 인식 결과 예시로 품목 3개를 채워요.</span></div></div></section>' +
          '<section class="panel"><div class="panel-h"><h2>직접 입력</h2></div>' +
            '<div class="form">' +
              '<label class="fl wide" for="f-date">구매일<input class="in" type="date" id="f-date" value="' + f.date + '" max="2026-11-12"></label>' +

              '<div class="wide"><button class="btn" data-act="add">목록에 추가</button></div>' +

        '</div>' +
        '<aside class="rcol">' +

            (S.draft.length ? S.draft.map(function (d) { return '<div class="ln"><span>' + ITEM[d.id].name + ' ' + ITEM[d.id].unit + (d.qty > 1 ? ' ×' + d.qty : '') + '</span><span>' + won(d.price) + '</span></div>'; }).join('') : '<div class="ln"><span>비어 있어요</span><span>0</span></div>') +

  }

  /* ---------- 화면: 리포트 ---------- */
  function chartSvg(ms, s) {
    var W = 600, H = 250, x0 = 50, x1 = 584, y0 = 212, y1 = 22;
    var ymax = Math.max(s.budget, ms.spent);
    var xs = function (d) { return x0 + (d - 1) / 29 * (x1 - x0); };
    var ys = function (v) { return y0 - v / ymax * (y0 - y1); };
    var byDay = {};
    ms.ps.forEach(function (p) { var d = p.day - MONTH0 + 1; byDay[d] = (byDay[d] || 0) + p.price; });
    var days = Object.keys(byDay).map(Number).sort(function (a, b) { return a - b; });
    var cum = 0, d = 'M' + xs(1) + ' ' + ys(0);
    days.forEach(function (dd) { d += ' L' + xs(dd) + ' ' + ys(cum); cum += byDay[dd]; d += ' L' + xs(dd) + ' ' + ys(cum); });
    var td = TODAY - MONTH0 + 1;
    d += ' L' + xs(td) + ' ' + ys(cum);
    var area = d + ' L' + xs(td) + ' ' + ys(0) + ' L' + xs(1) + ' ' + ys(0) + ' Z';
    var step = ymax >= 300000 ? 100000 : 50000, g = '';
    for (var v = 0; v <= ymax; v += step) {
      g += '<line class="gl" x1="' + x0 + '" x2="' + x1 + '" y1="' + ys(v) + '" y2="' + ys(v) + '"/><text class="ax" x="' + (x0 - 8) + '" y="' + (ys(v) + 4) + '" text-anchor="end">' + (v === 0 ? '0' : (v / 10000) + '만') + '</text>';
    }
    [1, 5, 10, 15, 20, 25, 30].forEach(function (t) { g += '<text class="ax" x="' + xs(t) + '" y="' + (y0 + 20) + '" text-anchor="middle">' + t + '일</text>'; });
    var anchor = xs(td) > x1 - 90 ? 'end' : 'middle';
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="11월 누적 식비와 예산 기준선">' + g +
      '<path d="' + area + '" fill="var(--surface-2)"/>' +
      '<path d="M' + xs(1) + ' ' + ys(s.budget / 30) + ' L' + xs(30) + ' ' + ys(s.budget) + '" fill="none" stroke="var(--ink-2)" stroke-width="1.8" stroke-dasharray="5 4"/>' +
      '<text class="ax" x="' + x1 + '" y="' + (ys(s.budget) - 8) + '" text-anchor="end">월 예산 ' + won(s.budget) + '원</text>' +
      '<path d="' + d + '" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>' +
      '<circle cx="' + xs(td) + '" cy="' + ys(cum) + '" r="4.5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>' +
      '<text class="ax" x="' + xs(td) + '" y="' + (ys(cum) - 12) + '" text-anchor="' + anchor + '" style="fill:var(--ink);font-weight:600">오늘 ' + won(cum) + '원</text></svg>';
  }

  function viewReport() {
    var s = S.settings, ms = monthStats();
    var gap = ms.pace - ms.spent;

    // 카테고리
    var cats = GROUPS.map(function (g) {

      return { g: g, v: v };
    }).sort(function (a, b) { return b.v - a.v; });
    var catHtml = cats.map(function (c) {
      return '<div class="cat"><span>' + c.g + '</span><div class="bar"><i style="width:' + (ms.spent ? (c.v / ms.spent * 100).toFixed(1) : 0) + '%"></i></div><span class="mono">' + won(c.v) + '</span></div>';
    }).join('');

    // 지난 장보기: 추천 vs 실제
    var L = lastTrip(), actual = S.purchases.filter(function (p) { return p.day === L; });
    var R = recommend(L, L, S.purchases, s, L);
    var buyIds = {}; R.buy.forEach(function (o) { buyIds[o.id] = true; });
    var holdMap = {}; R.hold.forEach(function (o) { holdMap[o.id] = o; });
    var inRec = actual.filter(function (p) { return buyIds[p.id]; });
    var outRec = actual.filter(function (p) { return !buyIds[p.id]; });
    var missed = R.buy.filter(function (o) { return !actual.some(function (p) { return p.id === o.id; }); });
    var pct = actual.length ? Math.round(inRec.length / actual.length * 100) : 0;
    var outHtml = outRec.length ? outRec.map(function (p) {
      var h = holdMap[p.id];
      return '<div class="dup"><span>' + ITEM[p.id].name + ' <span class="unit">' + ITEM[p.id].unit + '</span></span><span class="mono">' + won(p.price) + '</span><small>' + (h ? '추천에서는 보류였어요 · 재고 ' + (h.end - L) + '일치 남은 상태' : '이전 기록이 없는 품목') + '</small></div>';
    }).join('') : '<p class="note" style="padding-top:8px">추천 밖에서 산 품목이 없어요.</p>';

    // 중복구매
    var st = stockMap(S.purchases, s, Infinity), dups = [];
    ORDER.forEach(function (id) { if (st[id]) st[id].dups.forEach(function (d) { dups.push({ id: id, d: d }); }); });
    dups.sort(function (a, b) { return b.d.day - a.d.day; });
    var dupTotal = sum(dups, function (x) { return x.d.price; });
    var dupHtml = dups.length ? dups.map(function (x) {
      return '<div class="dup"><span>' + ITEM[x.id].name + ' <span class="unit">' + ITEM[x.id].unit + '</span></span><span class="mono">' + won(x.d.price) + '</span><small>' + md(x.d.day) + ' · 이미 ' + x.d.remaining + '일치가 남아 있었어요</small></div>';
    }).join('') : '<p class="note" style="padding-top:8px">감지된 중복 구매가 없어요.</p>';

    // 재방문(최근 4주 중 입력한 주)
    var weeks = [3, 2, 1, 0].map(function (k) {
      var end = TODAY - 7 * k, start = end - 6;

    });
    var wOn = weeks.filter(function (w) { return w.on; }).length;
    var wPct = Math.round(wOn / 4 * 100);

    function opt(key, v, label) {
      return '<button class="opt" data-act="sv" data-k="' + key + '" data-v="' + v + '" aria-pressed="' + (S.survey[key] === v) + '">' + label + '</button>';
    }

    var html =
      '<div class="g2">' +
        '<section class="panel"><div class="panel-h"><h2>11월 누적 식비</h2><span class="sub">오늘까지 ' + won(ms.spent) + '원 · ' + (gap >= 0 ? '기준선보다 ' + won(gap) + '원 덜 썼어요' : '기준선보다 ' + won(-gap) + '원 더 썼어요') + '</span></div>' +
          '<div class="legend"><span><i></i>실제 누적</span><span><i class="d"></i>예산 기준선(하루 ' + won(s.budget / 30) + '원)</span></div>' +
          '<div class="chartwrap">' + chartSvg(ms, s) + '</div></section>' +
        '<section class="panel"><div class="panel-h"><h2>카테고리별 지출</h2></div><div class="panel-b">' + catHtml + '</div></section>' +
      '</div>' +
      '<div class="g2" style="margin-top:16px;grid-template-columns:repeat(2,minmax(0,1fr))">' +
        '<section class="panel"><div class="panel-h"><h2>' + md(L) + ' 장보기, 추천대로 샀나요</h2></div><div class="panel-b">' +
          '<div class="big">' + inRec.length + '<small>/ ' + actual.length + '개가 추천 품목</small></div>' +
          '<div class="bar ' + (pct >= 70 ? 'good' : '') + '"><i style="width:' + pct + '%"></i></div>' +
          '<p class="note" style="margin-top:8px">추천했지만 사지 않은 품목 ' + missed.length + '개 · 추천 밖에서 산 품목 ' + outRec.length + '개</p>' +
          '<div style="margin-top:8px">' + outHtml + '</div></div></section>' +
        '<section class="panel"><div class="panel-h"><h2>중복 구매 감지</h2></div><div class="panel-b">' +
          '<div class="big">' + won(dupTotal) + '<small>원</small></div>' +
          '<p class="note" style="margin-top:4px">재고가 절반 넘게 남았을 때 또 산 금액이에요</p>' +
          '<div style="margin-top:8px">' + dupHtml + '</div></div></section>' +
      '</div>' +
      '<section class="panel" style="margin-top:16px"><div class="panel-h"><h2>가설 검증 3가지</h2><span class="sub">베타 사용자가 남기는 신호예요</span></div>' +
        '<div class="g3">' +
          '<div><div class="k-label">1. 최소 입력으로 꾸준히 쓰나</div>' +
            '<div class="big" style="margin-top:6px">' + wPct + '<small>% 재방문 (목표 70%)</small></div>' +
            '<div class="weeks">' + weeks.map(function (w) { return '<div class="' + (w.on ? 'on' : '') + '">' + md(w.a) + '~<br>' + (w.on ? '입력함' : '없음') + '</div>'; }).join('') + '</div>' +
            '<p class="note" style="margin-top:8px">최근 4주 중 ' + wOn + '주에 구매내역을 입력했어요</p></div>' +
          '<div><div class="k-label">2. 추천이 구매를 바꾸나</div>' +
            '<p style="margin-top:6px;font-weight:500">이번 추천이 도움이 됐나요?</p>' +
            '<div class="opts">' + opt('help', 'yes', '식비가 줄어든 것 같아요') + opt('help', 'so', '잘 모르겠어요') + opt('help', 'no', '달라진 게 없어요') + '</div></div>' +
          '<div><div class="k-label">3. 돈을 낼 의향이 있나</div>' +
            '<p style="margin-top:6px;font-weight:500">월 4,900원이면 계속 쓰실래요?</p>' +
            '<div class="opts">' + opt('pay', 'yes', '쓸래요') + opt('pay', 'maybe', '고민돼요') + opt('pay', 'no', '무료일 때만 쓸래요') + '</div></div>' +
        '</div></section>';
    return { title: '리포트', sub: '이번 달 지출, 추천 이행, 중복 구매를 한 번에 봐요', html: html };
  }

  /* ---------- 화면: 설정 ---------- */
  function viewSetup() {
    var s = S.settings, tripDay = nextTripDay();
    function seg(key, vals, fmt) {
      return '<div class="seg" role="group">' + vals.map(function (v) {
        return '<button data-act="seg" data-key="' + key + '" data-v="' + v + '" aria-pressed="' + (s[key] === v) + '">' + fmt(v) + '</button>';
      }).join('') + '</div>';
    }
    var html =
      '<div class="cols">' +
        '<section class="panel"><div class="panel-h"><h2>내 장보기 기준</h2><span class="sub">한 번만 정하면 돼요</span></div>' +
          '<div class="form">' +
            '<label class="fl wide" for="budget">월 식비 예산(원)<input class="in mono" type="number" id="budget" min="100000" max="2000000" step="10000" value="' + s.budget + '"></label>' +
            '<div class="wide fl">하루 식사 횟수' + seg('meals', [1, 2, 3], function (v) { return v + '끼'; }) + '</div>' +
            '<div class="wide fl">장보기 주기' + seg('cycle', [3, 4, 5, 7, 10], function (v) { return v + '일'; }) + '</div>' +
          '</div></section>' +
        '<aside class="rcol"><div class="receipt"><div class="r-top"><b>설정이 바꾸는 것</b></div>' +
          '<div class="ln"><span>다음 장보기</span><span>' + md(tripDay) + '</span></div>' +
          '<div class="ln"><span>1회 상한</span><span>' + won(budgetCap()) + '</span></div>' +
          '<div class="ln"><span>하루 예산</span><span>' + won(s.budget / 30) + '</span></div>' +
          '<div class="ln"><span>계란 10구</span><span>' + Math.max(1, Math.round(ITEM.egg.base * 2 / s.meals)) + '일치</span></div>' +
          '<div class="ln"><span>우유 1L</span><span>' + Math.max(1, Math.round(ITEM.milk.base * 2 / s.meals)) + '일치</span></div>' +
          '<div class="r-cap">식사 횟수가 많을수록 같은 품목이 더 빨리 떨어진다고 계산해요.</div></div></aside>' +
      '</div>';
    return { title: '설정', sub: '월 식비 예산, 하루 식사 횟수, 장보기 주기를 정해요', html: html };
  }

  /* ---------- 라우터 ---------- */
  var VIEWS = { recommend: viewRecommend, purchases: viewPurchases, report: viewReport, setup: viewSetup };
  function route() { var h = (location.hash || '#recommend').slice(1); return VIEWS[h] ? h : 'recommend'; }
  function render(focusSel) {
    var v = route();
    document.querySelectorAll('.nav a').forEach(function (a) {
      if (a.getAttribute('href') === '#' + v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    var out = VIEWS[v]();
    $('#view').innerHTML = out.html;
    $('#ttl').textContent = out.title;
    $('#sub').textContent = out.sub;
    $('#today').textContent = '오늘 ' + mdw(TODAY);
    if (focusSel) { var el = document.querySelector(focusSel); if (el && el.focus) el.focus(); }
  }
  var toastT;
  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  /* ---------- 이벤트 ---------- */
  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null; if (!b) return;
    var act = b.getAttribute('data-act');
    if (act === 'seg') { S.settings[b.getAttribute('data-key')] = Number(b.getAttribute('data-v')); render('[data-key="' + b.getAttribute('data-key') + '"][data-v="' + b.getAttribute('data-v') + '"]'); }
    else if (act === 'sv') { S.survey[b.getAttribute('data-k')] = b.getAttribute('data-v'); render('[data-k="' + b.getAttribute('data-k') + '"][data-v="' + b.getAttribute('data-v') + '"]'); toast('답변을 기록했어요'); }
    else if (act === 'add') {
      S.draft.push({ id: S.form.id, qty: S.form.qty, price: Math.max(0, Number(S.form.price) || 0) });
      render('[data-act="add"]'); toast(ITEM[S.form.id].name + '을(를) 담았어요');
    }
    else if (act === 'rm') { S.draft.splice(Number(b.getAttribute('data-i')), 1); render(); }
    else if (act === 'save') {
      if (!S.draft.length) { toast('저장할 내역이 없어요. 품목을 먼저 담아 주세요'); return; }
      var d = dayNum(S.form.date);
      S.draft.forEach(function (x) { S.purchases.push({ id: x.id, day: d, qty: x.qty, price: x.price }); });
      S.draft = []; S.photo = null; S.override = {};
      toast('저장했어요. 다음 장보기 추천을 새로 계산했어요');
      if (location.hash === '#recommend') render(); else location.hash = '#recommend';
    }
  });
  document.addEventListener('change', function (e) {
    var t = e.target, id = t.id;
    if (t.getAttribute && t.getAttribute('data-chk')) { S.override[t.getAttribute('data-chk')] = t.checked; render('#' + id); }
    else if (id === 'f-date') { if (t.value) S.form.date = t.value; render('#f-date'); }
    else if (id === 'f-id') { S.form.id = t.value; S.form.price = ITEM[t.value].price * S.form.qty; render('#f-id'); }
    else if (id === 'f-qty') { S.form.qty = Number(t.value); S.form.price = ITEM[S.form.id].price * S.form.qty; render('#f-qty'); }
    else if (id === 'f-price') { S.form.price = Number(t.value) || 0; }
    else if (id === 'budget') { S.settings.budget = Math.min(2000000, Math.max(100000, Math.round(Number(t.value) || 350000))); render('#budget'); }
    else if (id === 'photo') {
      var f = t.files && t.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        S.photo = fr.result;
        S.draft = [{ id: 'milk', qty: 1, price: ITEM.milk.price, demo: true }, { id: 'egg', qty: 1, price: ITEM.egg.price, demo: true }, { id: 'banana', qty: 1, price: ITEM.banana.price, demo: true }];
        render(); toast('인식 예시로 품목 3개를 채웠어요. 확인하고 저장하세요');
      };
      fr.readAsDataURL(f);
    }
  });
  document.addEventListener('input', function (e) { if (e.target.id === 'f-price') S.form.price = Number(e.target.value) || 0; });
  window.addEventListener('hashchange', function () { render(); try { window.scrollTo(0, 0); } catch (err) {} });
  render();
})();
</script>
</body>
</html>
